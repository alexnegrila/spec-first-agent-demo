name: contract

# Fails when the code drifts from api/openapi.yaml (see docs/adr/0001-the-openapi-file-is-the-contract.md).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Code matches the OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate from the contract, build, run contract-checked tests
        run: ./mvnw -B -ntp verify

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports
